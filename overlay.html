<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>К4ТВ · Статистика — overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --panel:rgba(12,15,21,.94);
  --center-bg:rgba(12,15,21,.8);   /* фон сводной панели: 80% непрозрачности */
  --deep:#05070b;
  --text:#f2f4f8;
  --amber:#ffb62e;
  --home:#ff5148;
  --away:#45c4ff;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:transparent;overflow:hidden}
body{font-family:'Oswald','Arial Narrow',Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}

/* ============ НИЖНЯЯ ЛЕНТА (модули друг за другом, по центру) ============ */
#tape{position:fixed;left:0;right:0;bottom:34px;display:flex;justify-content:center;align-items:flex-end}
.mod{
  display:flex;align-items:center;overflow:hidden;flex:none;
  background:var(--panel);border-top:2px solid #333d4d;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);
  height:56px;max-width:0;min-width:0;opacity:0;padding:0;margin:0;
  transition:max-width .55s var(--ease),opacity .3s ease,padding .55s var(--ease),margin .55s var(--ease);
}
.mod.on{opacity:1;margin-right:10px}
.mod.score{height:64px}
.mod.score.on{max-width:660px;padding:0 18px 0 0}
.mod.metric.on{max-width:430px;padding:0 14px 0 12px}

/* --- модуль табло: названия команд + счёт --- */
.team{display:flex;align-items:center;gap:10px;min-width:0;height:100%}
.cbar{flex:none;width:7px;height:100%}
.team.h .cbar{background:var(--home)}
.team.a .cbar{background:var(--away);order:2}
.tname{font-weight:600;font-size:21px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:225px}
.scorebox{flex:none;display:flex;align-items:center;gap:7px;height:100%;background:var(--deep);padding:0 16px;margin:0 12px}
.scorebox b{font-family:'Russo One';font-weight:400;font-size:30px;min-width:26px;text-align:center}
.scorebox i{font-style:normal;color:var(--amber);font-family:'Russo One';font-size:24px;transform:translateY(-1px)}

/* --- модуль метрики --- */
.mic{flex:none;width:20px;height:20px;color:var(--amber)}
.mic svg{width:100%;height:100%;display:block}
.mlabel{flex:1 1 auto;min-width:0;font-weight:500;font-size:14px;letter-spacing:.13em;color:#c9d0db;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnums{flex:none;display:flex;align-items:center;gap:9px;margin-left:12px}
.num{flex:none;display:flex;align-items:center;justify-content:center;min-width:42px;height:36px;padding:0 9px;background:var(--deep);border-bottom:3px solid var(--home);font-family:'Russo One';font-weight:400;font-size:23px}
.num.a{border-bottom-color:var(--away)}
.mdash{color:#57616f;font-weight:600;font-size:16px}

/* ============ СВОДНАЯ ПАНЕЛЬ (центр экрана, компактная) ============ */
#center{
  position:fixed;left:50%;top:50%;
  width:min(700px,86vw);
  background:var(--center-bg);
  border:1px solid #333d4d;border-top:3px solid var(--amber);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);
  padding:18px 26px 14px;
  opacity:0;transform:translate(-50%,-46%) scale(.97);pointer-events:none;
  transition:opacity .45s ease,transform .5s var(--ease);
}
#center.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

.c-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.c-head .kick{font-size:12px;font-weight:600;letter-spacing:.38em;color:var(--amber);margin-bottom:4px}
.c-head h2{margin:0;font-family:'Russo One';font-weight:400;font-size:27px;letter-spacing:.04em}
.c-stamp{flex:none;background:var(--amber);color:#1a1206;font-family:'Russo One';font-size:16px;padding:4px 10px 3px;clip-path:polygon(0 0,100% 0,100% 100%,8px 100%,0 calc(100% - 8px))}

.c-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:0 0 10px;border-bottom:1px solid #232b38}
.ct{display:flex;align-items:center;gap:10px;min-width:0}
.ct .cbar{width:6px;height:32px}
.ct.h .cbar{background:var(--home)}
.ct.a .cbar{background:var(--away)}
.ct .n{font-weight:600;font-size:21px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct.a{justify-content:flex-end}
.ct.a .n{text-align:right}
.c-score{flex:none;display:flex;align-items:center;gap:8px;background:var(--deep);padding:3px 16px}
.c-score b{font-family:'Russo One';font-weight:400;font-size:36px;min-width:38px;text-align:center}
.c-score i{font-style:normal;color:var(--amber);font-family:'Russo One';font-size:29px}

.c-rows{list-style:none;margin:2px 0 0;padding:0}
.c-rows li{
  display:grid;grid-template-columns:1fr 240px 1fr;gap:12px;align-items:center;
  padding:10px 8px;border-bottom:1px solid #1d2430;
  border-left:3px solid transparent;border-right:3px solid transparent;
  opacity:0;transform:translateY(14px);
  transition:opacity .45s ease,transform .5s var(--ease),background-color .25s ease,border-color .25s ease;
}
.c-rows li:last-child{border-bottom:none}
#center.show .c-rows li{opacity:1;transform:none}
#center.show .c-rows li:nth-child(1){transition-delay:.15s}
#center.show .c-rows li:nth-child(2){transition-delay:.22s}
#center.show .c-rows li:nth-child(3){transition-delay:.29s}
#center.show .c-rows li:nth-child(4){transition-delay:.36s}
#center.show .c-rows li:nth-child(5){transition-delay:.43s}
.c-rows li.focus{background:rgba(255,182,46,.09);border-left-color:var(--amber);border-right-color:var(--amber)}

.cr{display:flex;align-items:center;gap:12px;min-width:0}
.cr.h{grid-column:1;justify-content:flex-start}
.cr.a{grid-column:3;justify-content:flex-end}
.cr-num{flex:none;width:48px;font-family:'Russo One';font-weight:400;font-size:23px}
.cr.h .cr-num{text-align:left}
.cr.a .cr-num{text-align:right}
/* бар без фонового трека: видна только цветная заливка (при 0 — пусто) */
.cr-bar{flex:1 1 auto;height:7px;position:relative;overflow:hidden}
.cr-bar i{position:absolute;top:0;bottom:0;width:0;transition:width .8s var(--ease)}
.cr.h .cr-bar i{right:0;background:var(--home)}
.cr.a .cr-bar i{left:0;background:var(--away)}
.cr-label{grid-column:2;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.cr-label svg{flex:none;width:20px;height:20px;color:var(--amber)}
.cr-label span{font-weight:600;font-size:15px;letter-spacing:.12em;color:#c3cbd7;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-rows li.focus .cr-label span{color:var(--amber)}
</style>
</head>
<body>

<!-- Нижняя лента: табло генерируется статикой, метрики добавит скрипт -->
<div id="tape">
  <div class="mod score" id="m-score">
    <span class="team h"><i class="cbar"></i><span class="tname" id="t-home">КОМАНДА 1</span></span>
    <span class="scorebox"><b id="s-h">0</b><i>:</i><b id="s-a">0</b></span>
    <span class="team a"><span class="tname" id="t-away">КОМАНДА 2</span><i class="cbar"></i></span>
  </div>
</div>

<!-- Сводная панель по центру -->
<section id="center" aria-hidden="true">
  <div class="c-head">
    <div>
      <div class="kick">ПОСЛЕМАТЧЕВАЯ АНАЛИТИКА</div>
      <h2>СТАТИСТИКА МАТЧА</h2>
    </div>
    <span class="c-stamp">К4ТВ</span>
  </div>
  <div class="c-teams">
    <div class="ct h"><i class="cbar"></i><span class="n" id="c-home">КОМАНДА 1</span></div>
    <div class="c-score"><b id="c-s-h">0</b><i>:</i><b id="c-s-a">0</b></div>
    <div class="ct a"><span class="n" id="c-away">КОМАНДА 2</span><i class="cbar"></i></div>
  </div>
  <ul class="c-rows" id="crows"></ul>
</section>

<script type="module">
/* ================= КОНФИГУРАЦИЯ ================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyADAluZKWJz3polD5ban0AUqB38YmFO5k0",
  authDomain: "mini-foot-stat.firebaseapp.com",
  projectId: "mini-foot-stat",
  storageBucket: "mini-foot-stat.firebasestorage.app",
  messagingSenderId: "397513904145",
  appId: "1:397513904145:web:c00c2709b68d63553461b0"
};
const PATH = 'k4tv';
/* URL базы подбирается автоматически (?db=… > сохранённый > дефолт > europe-west1) */
const URL_CANDIDATES = [...new Set([
  new URLSearchParams(location.search).get('db'),
  (()=>{try{return localStorage.getItem('k4tv_dburl')}catch{return null}})(),
  'https://mini-foot-stat-default-rtdb.firebaseio.com',
  'https://mini-foot-stat-default-rtdb.europe-west1.firebasedatabase.app'
].filter(Boolean))];

const METRICS = [
  {k:'shots',   label:'УДАРЫ ПО ВОРОТАМ'},
  {k:'combo',   label:'СЕРИИ ИЗ 3-Х ПЕРЕДАЧ'},
  {k:'tackles', label:'ОТБОРЫ'},
  {k:'tackles', label:'ОТБОРЫ'},
  {k:'fouls',   label:'НАРУШЕНИЯ'},
  {k:'ycards',  label:'ЖЁЛТЫЕ КАРТОЧКИ'}
];
const ICONS = {
  shots:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.9l4.1 3-1.6 4.7h-5l-1.6-4.7z"/></svg>',
  combo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="4.6" cy="17.2" r="1.8"/><circle cx="12" cy="7.4" r="1.8"/><circle cx="19.4" cy="17.2" r="1.8"/><path d="M6.1 15.6l4.7-6.4M13.2 9.2l4.7 6.4"/></svg>',
  tackles:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.1l6.9 2.9v5.1c0 4.6-3 7.7-6.9 9.8-3.9-2.1-6.9-5.2-6.9-9.8V6z"/></svg>',
  fouls:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.4" cy="14.6" r="5.3"/><path d="M13.3 10.8l7.2-4.4v4.2l-4.2 2.4"/><circle cx="9.4" cy="14.6" r="1.2"/></svg>',
  ycards:'<svg viewBox="0 0 24 24" fill="#ffd21f"><rect x="7.4" y="3.9" width="9.4" height="16.2" rx="1.5" transform="rotate(7 12 12)"/></svg>'
};

const DEFAULT_STATE = {
  rev:0,
  home:{name:'КОМАНДА 1',color:'#ff5148'},
  away:{name:'КОМАНДА 2',color:'#45c4ff'},
  score:{h:0,a:0},
  stats:{shots:{h:0,a:0},combo:{h:0,a:0},tackles:{h:0,a:0},fouls:{h:0,a:0},ycards:{h:0,a:0}},
  modules:{score:false,shots:false,combo:false,tackles:false,fouls:false,ycards:false},
  autoScore:true,
  center:{on:false,focus:null}
};
const clone = o => JSON.parse(JSON.stringify(o));
function normState(raw){
  const s = clone(DEFAULT_STATE);
  if(!raw || typeof raw!=='object') return s;
  s.rev = raw.rev || 0;
  if(raw.home) s.home = {...s.home, ...raw.home};
  if(raw.away) s.away = {...s.away, ...raw.away};
  if(raw.score) s.score = {...s.score, ...raw.score};
  if(raw.stats) for(const k in s.stats) if(raw.stats[k]) s.stats[k] = {...s.stats[k], ...raw.stats[k]};
  if(raw.modules) for(const k in s.modules) if(k in raw.modules) s.modules[k] = !!raw.modules[k];
  s.autoScore = raw.autoScore !== undefined ? !!raw.autoScore : true;
  if(raw.center) s.center = {...s.center, ...raw.center};
  return s;
}

/* ================= СБОРКА DOM ================= */
const byId = id => document.getElementById(id);
const tape = byId('tape');
METRICS.forEach(m=>{
  const d = document.createElement('div');
  d.className = 'mod metric'; d.id = 'm-'+m.k;
  d.innerHTML =
    `<span class="mic">${ICONS[m.k]}</span>`+
    `<span class="mlabel">${m.label}</span>`+
    `<span class="mnums"><span class="num" id="v-${m.k}-h">0</span><span class="mdash">—</span><span class="num a" id="v-${m.k}-a">0</span></span>`;
  tape.appendChild(d);
});
const crows = byId('crows');
METRICS.forEach(m=>{
  const li = document.createElement('li'); li.dataset.k = m.k;
  li.innerHTML =
    `<div class="cr h"><b class="cr-num" id="cv-${m.k}-h">0</b><div class="cr-bar"><i id="cb-${m.k}-h"></i></div></div>`+
    `<div class="cr-label">${ICONS[m.k]}<span>${m.label}</span></div>`+
    `<div class="cr a"><div class="cr-bar"><i id="cb-${m.k}-a"></i></div><b class="cr-num" id="cv-${m.k}-a">0</b></div>`;
  crows.appendChild(li);
});

/* ================= РЕНДЕР ================= */
let curRev = 0;
function render(st){
  document.documentElement.style.setProperty('--home', st.home.color || '#ff5148');
  document.documentElement.style.setProperty('--away', st.away.color || '#45c4ff');

  /* нижняя лента */
  const anyMetric = METRICS.some(m=>st.modules[m.k]);
  byId('m-score').classList.toggle('on', !!(st.modules.score || (st.autoScore && anyMetric)));
  byId('t-home').textContent = st.home.name;
  byId('t-away').textContent = st.away.name;
  byId('s-h').textContent = st.score.h;
  byId('s-a').textContent = st.score.a;
  METRICS.forEach(m=>{
    byId('m-'+m.k).classList.toggle('on', !!st.modules[m.k]);
    byId('v-'+m.k+'-h').textContent = st.stats[m.k].h;
    byId('v-'+m.k+'-a').textContent = st.stats[m.k].a;
  });

  /* сводная панель */
  byId('center').classList.toggle('show', !!st.center.on);
  byId('c-home').textContent = st.home.name;
  byId('c-away').textContent = st.away.name;
  byId('c-s-h').textContent = st.score.h;
  byId('c-s-a').textContent = st.score.a;
  METRICS.forEach(m=>{
    const h = st.stats[m.k].h, a = st.stats[m.k].a;
    const max = Math.max(h,a);
    byId('cv-'+m.k+'-h').textContent = h;
    byId('cv-'+m.k+'-a').textContent = a;
    byId('cb-'+m.k+'-h').style.width = (max>0 ? h/max*100 : 0) + '%';
    byId('cb-'+m.k+'-a').style.width = (max>0 ? a/max*100 : 0) + '%';
    const li = crows.querySelector(`li[data-k="${m.k}"]`);
    li.classList.toggle('focus', st.center.focus === m.k);
  });
}
function apply(raw){
  const st = normState(raw);
  if(st.rev <= curRev) return;           /* дедупликация по ревизии */
  curRev = st.rev;
  render(st);
}

/* стартовое состояние (мгновенно, из локального кэша) */
render(clone(DEFAULT_STATE));
try{ const c = JSON.parse(localStorage.getItem('k4tv_state')); if(c) apply(c); }catch{}

/* ================= ЛОКАЛЬНЫЙ КАНАЛ (fallback) ================= */
if('BroadcastChannel' in window){
  const bc = new BroadcastChannel('k4tv');
  bc.onmessage = e => { const m=e.data; if(m && m.t==='state' && m.s) apply(m.s); };
}
window.addEventListener('storage', e=>{
  if(e.key==='k4tv_state' && e.newValue){ try{ apply(JSON.parse(e.newValue)); }catch{} }
});

/* ================= FIREBASE REALTIME DATABASE ================= */
async function ping(url){                       /* проверка, существует ли инстанс БД */
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 3500);
  try{
    const r = await fetch(url + '/.json?shallow=true', {signal:ctrl.signal});
    clearTimeout(t);
    return r.status===200 || r.status===401 || r.status===403;
  }catch{ clearTimeout(t); return false; }
}
(async()=>{
  let url = null;
  for(const c of URL_CANDIDATES){ if(await ping(c)){ url = c; break; } }
  if(!url){ console.warn('[К4ТВ] база не найдена — работаю на локальном канале'); return; }
  try{
    const {initializeApp} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const {getDatabase, ref, onValue} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
    const app = initializeApp({...FIREBASE_CONFIG, databaseURL:url});
    const db  = getDatabase(app);
    try{ localStorage.setItem('k4tv_dburl', url); }catch{}
    onValue(ref(db, PATH), snap => apply(snap.val()),
      err => console.warn('[К4ТВ] чтение БД:', err && err.message));
  }catch(e){ console.warn('[К4ТВ] Firebase недоступен:', e); }
})();
</script>
</body>
</html>
