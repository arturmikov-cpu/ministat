<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СВОЯ ИГРА — Overlay (1920×1080)</title>
<!--
  OVERLAY "СВОЯ ИГРА" — экран для игроков (1920×1080).
  Данные приходят из Firebase Realtime DB (узел /game), управляется пультом ведущего (svoya-host.html).
  Тест без Firebase: откройте файл с параметром  ?demo=1
  Сценарии для теста: ?demo=1&show=q   (вопрос)   ?demo=1&show=qimg (вопрос с картинкой)
                      ?demo=1&show=a   (ответ)    ?demo=1&show=cat  (кот в мешке)
                      ?demo=1&show=win (победитель)
-->
<style>
:root{
  --gold:#ffd75e; --gold-d:#c9922a;
  --blue1:#0f54c8; --blue2:#083f9e; --blue3:#0a2458; --bg:#050d24;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif}

/* ===== СЦЕНА 1920x1080, масштабируется под окно ===== */
#stage{
  position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;
  overflow:hidden;
  background:
    radial-gradient(1500px 950px at 50% 22%, #133c90 0%, #0a2258 46%, var(--bg) 100%);
}
#stage:before{ /* лёгкая виньетка */
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  box-shadow:inset 0 0 240px rgba(0,0,10,.75);
}

/* ===== Верхние плашки ===== */
#logo{position:absolute;left:44px;top:28px;z-index:30;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
#logo .box{
  background:linear-gradient(180deg,#1059d0,#083a92);
  border:3px solid var(--gold);border-radius:16px;padding:8px 26px;
  box-shadow:inset 0 0 20px rgba(255,215,94,.14);
}
#logo b{font-size:34px;color:var(--gold);letter-spacing:4px;text-shadow:0 0 12px rgba(255,215,94,.45)}
#logo small{display:block;text-align:center;color:#bcd2ff;font-size:13px;letter-spacing:3px;margin-top:2px}
#roundBadge{
  position:absolute;right:48px;top:34px;z-index:30;color:#fff;font-size:32px;font-weight:bold;
  letter-spacing:6px;opacity:.92;text-shadow:0 2px 10px rgba(0,0,0,.6);
}

/* ===== Игровое поле ===== */
#board{position:absolute;left:60px;right:60px;top:120px;bottom:240px;z-index:10;display:grid;gap:12px}
.tTheme{
  background:linear-gradient(180deg,#0d5bd6,#083f9e);
  border:3px solid rgba(255,215,94,.5);border-radius:14px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  color:#fff;font-size:var(--tfs,38px);font-weight:bold;letter-spacing:2px;
  padding:4px 10px;text-shadow:0 2px 6px rgba(0,0,0,.5);text-transform:uppercase;
  box-shadow:0 8px 22px rgba(0,0,10,.35);
}
.cell{
  position:relative;
  background:linear-gradient(180deg,#123a8f,#0a2458);
  border:3px solid rgba(255,255,255,.28);border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--gold);
  text-shadow:0 0 18px rgba(255,207,64,.35),0 3px 8px rgba(0,0,0,.6);
  box-shadow:0 8px 22px rgba(0,0,10,.35);
}
.cell .price{font-size:var(--cfs,46px)}
.cell.used{background:linear-gradient(180deg,#0b1c44,#081329);border-color:rgba(255,255,255,.09)}
.cell.used .price{display:none}
.cell.blank{visibility:hidden}
.cell.sel{animation:cellSelect 2s cubic-bezier(.3,.8,.4,1) both;z-index:12}
@keyframes cellSelect{
  0%{filter:brightness(.85);transform:scale(1)}
  18%{transform:scale(1.24);filter:brightness(2.5)}
  38%{transform:scale(1.02);filter:brightness(1.15)}
  56%{transform:scale(1.16);filter:brightness(2.1)}
  72%{transform:scale(1.08);filter:brightness(1.5)}
  100%{transform:scale(1.14);filter:brightness(2.2)}
}
#emptyBoard{position:absolute;left:60px;right:60px;top:120px;bottom:240px;z-index:9;display:none;
  align-items:center;justify-content:center;color:#8fa8d8;font-size:34px;letter-spacing:2px;text-align:center}
/* ===== Карточка вопроса/ответа ===== */
#modalWrap{
  position:absolute;left:48px;right:48px;top:110px;bottom:240px;z-index:35;
  display:none;align-items:center;justify-content:center;perspective:1700px;
  background:radial-gradient(1150px 660px at 50% 40%, rgba(9,22,58,.88), rgba(2,6,16,.9));
  border:3px solid rgba(255,215,94,.28);border-radius:24px;
}
#modalWrap.on{display:flex}
.card{
  position:absolute;inset:32px;
  background:linear-gradient(180deg,#0f3f9c,#0a2258);
  border:5px solid var(--gold);border-radius:26px;
  box-shadow:0 24px 70px rgba(0,0,0,.65), inset 0 0 70px rgba(60,120,255,.10);
  display:flex;flex-direction:column;padding:26px 46px;transform-origin:50% 15%;
}
.card.hidden{display:none}
.card.in{animation:cardIn .85s cubic-bezier(.2,.85,.3,1.05) both}
.card.out{animation:cardOut .95s ease both}
@keyframes cardIn{
  0%{opacity:0;transform:rotateX(82deg) scale(.92)}
  55%{opacity:1;transform:rotateX(-7deg) scale(1.01)}
  100%{opacity:1;transform:rotateX(0) scale(1)}
}
@keyframes cardOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.94)}}
.cardTop{
  color:var(--gold);font-size:30px;letter-spacing:9px;text-align:center;font-weight:bold;
  margin-bottom:10px;text-shadow:0 0 14px rgba(255,215,94,.4);flex:0 0 auto;
}
.cardTop.ansTop{color:#7dff8a;text-shadow:0 0 16px rgba(125,255,138,.35)}
.cardBody{flex:1;display:flex;flex-direction:column;min-height:0;gap:14px}
.cardText{
  flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;
  color:#fff;font-weight:bold;line-height:1.16;overflow:hidden;padding:0 12px;white-space:pre-wrap;
}
.cardImg{flex:0 1 56%;min-height:0;object-fit:contain;width:100%;display:none;filter:drop-shadow(0 10px 26px rgba(0,0,0,.55))}
.card.onlyimg .cardImg{flex:1 1 auto;display:block}
.card.onlyimg .cardText{display:none}

/* ===== Кот в мешке ===== */
#catIntro{
  position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(1000px 700px at 50% 42%, #2b1152 0%, #0a0417 72%);
}
#catIntro.on{display:flex;animation:fadeIn .4s both}
#catIntro .qmark{position:absolute;color:rgba(255,215,94,.10);font-weight:900;font-size:200px}
#catSvg{width:520px;height:auto;filter:drop-shadow(0 0 70px rgba(140,70,255,.4));
  animation:catIn 2.6s cubic-bezier(.2,.9,.3,1.35) both}
@keyframes catIn{
  0%{transform:scale(.12) rotate(-16deg);opacity:0}
  30%{transform:scale(1.18) rotate(4deg);opacity:1}
  45%{transform:scale(.95) rotate(-3deg)}
  60%{transform:scale(1.06) rotate(2deg)}
  75%{transform:scale(.99)}
  100%{transform:scale(1.05)}
}
.catEye{animation:catBlink 1.15s infinite;transform-box:fill-box;transform-origin:center}
@keyframes catBlink{0%,86%,100%{transform:scaleY(1)}92%{transform:scaleY(.06)}}
.catPupil{animation:pupilGlow 1.4s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pupilGlow{from{opacity:.75}to{opacity:1}}
#catIntro .catLabel{
  margin-top:26px;color:var(--gold);font-size:64px;font-weight:900;letter-spacing:8px;
  text-shadow:0 0 26px rgba(255,215,94,.55);animation:catFlash .8s infinite alternate;
}
@keyframes catFlash{from{opacity:.55}to{opacity:1}}

/* ===== Сплэш раунда / заставка ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
#splash{
  position:absolute;inset:0;z-index:45;display:none;align-items:center;justify-content:center;
  background:radial-gradient(1200px 800px at 50% 35%, rgba(18,52,128,.96), rgba(3,7,20,.97));
}
#splash.on{display:flex}
#splash span{
  color:var(--gold);font-size:150px;font-weight:900;letter-spacing:14px;
  text-shadow:0 0 50px rgba(255,215,94,.4),0 8px 30px rgba(0,0,0,.7);
  animation:splashPop 2s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes splashPop{
  0%{opacity:0;transform:scale(.5)}
  22%{opacity:1;transform:scale(1.04)}
  75%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.35)}
}
#titleScreen{
  position:absolute;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;gap:34px;
}
#titleScreen.on{display:flex}
#titleScreen .emblem{
  text-align:center;background:linear-gradient(180deg,#1059d0,#083a92);
  border:6px solid var(--gold);border-radius:28px;padding:38px 70px;
  box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 0 40px rgba(255,215,94,.12);
  animation:emblemIn 1.2s cubic-bezier(.2,.9,.3,1.2) both;
}
#titleScreen .emblem h1{color:var(--gold);font-size:110px;letter-spacing:10px;text-shadow:0 0 34px rgba(255,215,94,.5)}
#titleScreen .emblem p{color:#bcd2ff;font-size:26px;letter-spacing:8px;margin-top:10px}
@keyframes emblemIn{from{opacity:0;transform:scale(.7) rotateX(28deg)}to{opacity:1;transform:scale(1)}}
#titleScreen .tPlayers{display:flex;gap:30px}
#titleScreen .tPlayers span{
  color:var(--gold);font-weight:bold;font-size:34px;letter-spacing:3px;
  border:2px solid rgba(255,215,94,.4);border-radius:12px;padding:10px 26px;background:rgba(0,0,0,.35);
}
#titleScreen .tHint{color:#5f7bb3;font-size:20px;letter-spacing:2px}
/* ===== Панель игроков ===== */
#playersRow{
  position:absolute;left:0;right:0;bottom:22px;z-index:50;
  display:flex;gap:48px;justify-content:center;transition:opacity .45s;
}
#playersRow.off{opacity:0;pointer-events:none}
.pbox{
  width:468px;height:158px;flex:0 0 auto;
  background:radial-gradient(340px 130px at 50% 30%, #101014 0%, #000 75%);
  border:4px solid #fff;border-radius:20px;
  box-shadow:0 10px 34px rgba(0,0,0,.65);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:transform .65s cubic-bezier(.2,.9,.3,1.25), box-shadow .5s, opacity .5s, border-color .3s;
}
.pname{
  color:var(--gold);font-weight:900;font-size:44px;letter-spacing:3px;line-height:1.05;text-align:center;
  background:linear-gradient(180deg,#ffefb0 10%,#ffd75e 45%,#e0a32e 90%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.8));max-width:430px;overflow:hidden;white-space:nowrap;
}
.pbox.narrow .pname{font-size:34px}
.pbox.tiny .pname{font-size:26px}
.pscore{font-weight:900;font-size:64px;line-height:1;text-shadow:0 0 22px currentColor}
.pscore.pos{color:#3dff75}
.pscore.zero{color:#9aa0a6;text-shadow:none}
.pscore.neg{color:#ff2d2d}
.pbox.active{border-color:var(--gold);box-shadow:0 0 44px rgba(255,215,94,.5);animation:activePulse 1s infinite alternate}
.pbox.active::after{
  content:"ОТВЕЧАЕТ";position:absolute;top:-16px;right:-14px;background:var(--gold);color:#1a1a1a;
  font-size:18px;font-weight:900;letter-spacing:2px;padding:4px 12px;border-radius:10px;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
}
@keyframes activePulse{from{transform:scale(1)}to{transform:scale(1.03)}}
.pbox.winblink{animation:winBlink .4s steps(1,end) 3}
@keyframes winBlink{0%{opacity:1}50%{opacity:.15}}
.pbox.winbig{transform:scale(2.05);z-index:55;border-color:var(--gold);
  box-shadow:0 0 90px rgba(255,215,94,.65)}
.playersDim .pbox{opacity:.22}
.playersDim .pbox.winbig{opacity:1}

/* ===== Экран победителя ===== */
#confetti{position:absolute;inset:0;z-index:64;pointer-events:none;display:none}
#winnerScreen{
  position:absolute;inset:0;z-index:65;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(1100px 750px at 50% 38%, rgba(43,22,116,.88), rgba(3,6,18,.95));
}
#winnerScreen.on{display:flex;animation:fadeIn .8s both}
#winnerScreen .wLabel{color:#fff;font-size:56px;letter-spacing:14px;font-weight:bold;opacity:.85}
#winnerScreen .wName{
  font-weight:900;font-size:150px;letter-spacing:6px;line-height:1;text-align:center;max-width:1700px;
  background:linear-gradient(180deg,#fff6c4 5%,#ffd75e 45%,#e09a1e 95%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 24px rgba(255,200,60,.35)) drop-shadow(0 4px 6px rgba(0,0,0,.7));
  animation:winNameIn .9s cubic-bezier(.2,.9,.3,1.3) both;
}
@keyframes winNameIn{from{opacity:0;transform:scale(.45)}to{opacity:1;transform:scale(1)}}
#winnerScreen .wScore{color:#dfe8ff;font-size:52px;font-weight:bold;letter-spacing:2px}

/* ===== Служебные элементы ===== */
#soundBtn{
  position:absolute;right:22px;bottom:196px;z-index:80;display:none;cursor:pointer;
  background:rgba(0,0,0,.55);color:#ffd75e;border:2px solid rgba(255,215,94,.5);border-radius:12px;
  font-size:16px;padding:8px 14px;letter-spacing:1px;
}
#soundBtn.show{display:block;animation:fadeIn .3s}
#conn{
  position:absolute;left:20px;bottom:8px;z-index:80;color:#5f7bb3;font-size:15px;letter-spacing:1px;
}
#conn.err{color:#ff6b6b;font-weight:bold}

/* ===== Сгенерировано: панель, карточки… ===== */
</style>
</head>
<body>
<div id="stage">
  <canvas id="confetti" width="1920" height="1080"></canvas>

  <div id="logo"><div class="box"><b>СВОЯ ИГРА</b><small>интеллектуальное шоу</small></div></div>
  <div id="roundBadge">РАУНД 1</div>

  <div id="board"></div>
  <div id="emptyBoard">Поле будет здесь — настройте раунд в пульте ведущего</div>

  <div id="modalWrap">
    <div class="card hidden" id="cardQ">
      <div class="cardTop">ВОПРОС</div>
      <div class="cardBody"><div class="cardText"></div><img class="cardImg" alt=""></div>
    </div>
    <div class="card hidden" id="cardA">
      <div class="cardTop ansTop">ОТВЕТ</div>
      <div class="cardBody"><div class="cardText"></div><img class="cardImg" alt=""></div>
    </div>
  </div>

  <div id="catIntro">
    <span class="qmark" style="left:12%;top:10%">?</span>
    <span class="qmark" style="right:11%;top:16%">?</span>
    <span class="qmark" style="left:20%;bottom:16%">?</span>
    <span class="qmark" style="right:18%;bottom:10%">?</span>
    <svg id="catSvg" viewBox="0 0 240 200">
      <circle cx="208" cy="30" r="14" fill="#f6e8b8" opacity=".9"/>
      <polygon points="38,86 68,14 104,68" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="3"/>
      <polygon points="54,72 72,30 92,64" fill="#3d1a5c"/>
      <polygon points="202,86 172,14 136,68" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="3"/>
      <polygon points="186,72 168,30 148,64" fill="#3d1a5c"/>
      <ellipse cx="120" cy="126" rx="96" ry="80" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="3"/>
      <ellipse cx="120" cy="157" rx="50" ry="32" fill="#17171a"/>
      <g class="catEye"><ellipse cx="86" cy="112" rx="17" ry="20" fill="#9dff5a"/><ellipse class="catPupil" cx="86" cy="112" rx="4.5" ry="16" fill="#062a06"/><circle cx="79" cy="104" r="3" fill="#fff" opacity=".85"/></g>
      <g class="catEye"><ellipse cx="154" cy="112" rx="17" ry="20" fill="#9dff5a"/><ellipse class="catPupil" cx="154" cy="112" rx="4.5" ry="16" fill="#062a06"/><circle cx="147" cy="104" r="3" fill="#fff" opacity=".85"/></g>
      <polygon points="108,142 132,142 120,157" fill="#ff8fb3"/>
      <path d="M108,160 Q114,171 120,160 Q126,171 132,160" stroke="#666" stroke-width="3" fill="none"/>
      <g stroke="#cbcbcb" stroke-width="2.5" stroke-linecap="round">
        <path d="M98,140 L26,130"/><path d="M96,150 L24,148"/><path d="M98,160 L28,168"/>
        <path d="M142,140 L214,130"/><path d="M144,150 L216,148"/><path d="M142,160 L212,168"/>
      </g>
    </svg>
    <div class="catLabel">КОТ В МЕШКЕ!</div>
  </div>

  <div id="splash"><span id="splashText">РАУНД 2</span></div>

  <div id="titleScreen">
    <div class="emblem">
      <h1>СВОЯ ИГРА</h1>
      <p>интеллектуальное шоу</p>
    </div>
    <div class="tPlayers" id="tPlayers"></div>
    <div class="tHint">настройка игры — в пульте ведущего</div>
  </div>

  <div id="playersRow">
    <div class="pbox" id="pb-p1"><div class="pname" id="pn-p1"></div><div class="pscore zero" id="pv-p1">0</div></div>
    <div class="pbox" id="pb-p2"><div class="pname" id="pn-p2"></div><div class="pscore zero" id="pv-p2">0</div></div>
    <div class="pbox" id="pb-p3"><div class="pname" id="pn-p3"></div><div class="pscore zero" id="pv-p3">0</div></div>
  </div>

  <div id="winnerScreen">
    <div class="wLabel">ПОБЕДИТЕЛЬ</div>
    <div class="wName" id="wName"></div>
    <div class="wScore" id="wScore"></div>
  </div>

  <button id="soundBtn">🔊 включить звук</button>
  <div id="conn">подключение…</div>
</div>

<script>
"use strict";
/* ===================== Firebase (REST, без SDK) ===================== */
const DB_URL = "https://korekovgame65-default-rtdb.europe-west1.firebasedatabase.app/";
const ROOT = "game";
const qs = new URLSearchParams(location.search);
const DEMO = qs.has("demo");

let state = null;
let es = null, firstMsg = false, pollFallback = null, denyError = false;

function url(p){ return DB_URL + ROOT + (p ? "/" + p : "") + ".json"; }

/* --- структура по умолчанию --- */
function defaultPlayers(){
  return { p1:{name:"ПАВЕЛ",score:0}, p2:{name:"МИХАИЛ",score:0}, p3:{name:"ИВАН",score:0} };
}
function migrate(s){
  s = s || {};
  s.players = s.players || defaultPlayers();
  for (const k of ["p1","p2","p3"]){
    s.players[k] = s.players[k] || {name:"",score:0};
    s.players[k].name = String(s.players[k].name || "");
    s.players[k].score = Math.round(+s.players[k].score || 0);
  }
  s.meta = s.meta || {};
  s.meta.playersVisible = s.meta.playersVisible !== false;
  s.meta.boardVisible = !!s.meta.boardVisible;
  s.meta.winner = s.meta.winner || null;
  s.meta.musicUrl = String(s.meta.musicUrl || "");
  s.live = s.live || {};
  s.live.round = Math.max(0, Math.round(+s.live.round || 0));
  s.live.phase = s.live.phase || "idle";
  s.live.cell = s.live.cell || null;
  s.live.activePlayer = s.live.activePlayer || null;
  s.plan = s.plan || {};
  s.plan.roundCount = Math.max(1, Math.min(6, Math.round(+s.plan.roundCount || 1)));
  s.plan.rounds = s.plan.rounds || [];
  return s;
}

/* --- helpers по плану --- */
function pairsOf(x){
  if (x == null) return [];
  if (Array.isArray(x)) return x.map((v,i)=>({key:String(i), v}));
  return Object.keys(x).map(k=>({key:k, v:x[k]}))
    .sort((a,b)=>a.key.localeCompare(b.key, undefined, {numeric:true}));
}
function listOf(x){ return pairsOf(x).map(p=>p.v); }
function roundData(idx){
  const rs = (state.plan && state.plan.rounds) || [];
  return rs[idx] || {themes:[]};
}
function themesOf(rd){ return pairsOf(rd.themes).filter(p=>p.v && !p.v.deleted); }
function cellsOf(t){ return pairsOf(t.cells).filter(p=>p.v && !p.v.deleted); }
function cellByRef(ref){
  try{
    const rd = state.plan.rounds[+ref.r]; if (!rd) return null;
    const t = rd.themes && rd.themes[ref.t]; if (!t || t.deleted) return null;
    const c = t.cells && t.cells[ref.c]; return (c && !c.deleted) ? c : null;
  }catch(e){ return null; }
}

/* --- применение SSE-события --- */
function setPath(seg, val){
  if (!seg.length){ state = migrate(val); return; }
  let o = state;
  for (let i=0;i<seg.length-1;i++){
    const k = seg[i];
    if (o[k] == null) o[k] = (/^\d+$/.test(seg[i+1]) ? [] : {});
    o = o[k];
  }
  const k = seg[seg.length-1];
  if (val === null) delete o[k]; else o[k] = val;
}
function onSSE(e){
  firstMsg = true; denyError = false;
  let msg; try{ msg = JSON.parse(e.data); }catch(err){ return; }
  const seg = String(msg.path || "/").split("/").filter(Boolean);
  if (e.type === "put"){
    setPath(seg, msg.data);
  } else { /* patch */
    for (const k of Object.keys(msg.data||{})) setPath(seg.concat(k), msg.data[k]);
  }
  scheduleRender();
}
function setStatus(connOk, err){
  const el = document.getElementById("conn");
  el.classList.toggle("err", !!err);
  el.textContent = err ? err : (connOk ? "Firebase: подключено" : "подключение…");
}
function connect(){
  if (DEMO){ state = migrate(demoState()); applyShowParam(); setStatus(true, "ДЕМО: без Firebase"); scheduleRender(); return; }
  // первичная проверка доступа
  fetch(url(""))
    .then(r=>{ if (!r.ok){ denyError = true; setStatus(false,"НЕТ ДОСТУПА: откройте правила БД для узла game"); } else setStatus(true); })
    .catch(()=>setStatus(false,"нет сети"));
  es = new EventSource(url("") + "?");
  es.addEventListener("put", onSSE);
  es.addEventListener("patch", onSSE);
  es.addEventListener("open", ()=>{ if(!denyError) setStatus(true); });
  es.addEventListener("error", ()=>{ if (denyError) return; if(!firstMsg) setStatus(false, "подключение…"); else setStatus(true, null); });
  // страховка: если поток не стартовал, включаем опрос раз в 1.5 с
  setTimeout(()=>{
    if (!firstMsg){
      pollFallback = setInterval(async ()=>{
        try{
          const r = await fetch(url("") + "?t=" + Date.now());
          if (r.ok){ state = migrate(await r.json()); scheduleRender(); setStatus(true); }
          else if (!denyError) setStatus(false, "НЕТ ДОСТУПА: откройте правила БД для узла game");
        }catch(e){}
      }, 1500);
    }
  }, 6000);
}

/* ===================== цикл отрисовки ===================== */
let renderQueued = false;
function scheduleRender(){
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(()=>{ renderQueued = false; render(); });
}
/* ===================== отрисовка ===================== */
const $ = id => document.getElementById(id);
function fitStage(){
  const k = Math.min(innerWidth/1920, innerHeight/1080);
  $("stage").style.transform = "translate(-50%,-50%) scale(" + k + ")";
}
addEventListener("resize", ()=>{ fitStage(); if (curCard) fitCard(curCard); });

/* --- игровое поле --- */
let boardKey = "";
function buildBoardKey(){
  const l = state.live || {};
  const rd = roundData(l.round);
  let k = "R" + l.round + "|";
  for (const p of themesOf(rd)){
    k += (p.v.title||"") + "~";
    for (const c of cellsOf(p.v)) k += (c.used?"u":"n") + (c.price|0) + ";";
    k += "!";
  }
  return k;
}
function renderBoard(){
  const l = state.live || {};
  const visible = !!state.meta.boardVisible;
  const rd = roundData(l.round);
  const themes = themesOf(rd);
  $("board").style.display = visible ? "" : "none";
  $("emptyBoard").style.display = (visible && !themes.length) ? "flex" : "none";
  const key = buildBoardKey() + "|" + visible;
  if (key === boardKey) return;
  boardKey = key;
  const b = $("board"); b.innerHTML = "";
  const n = themes.length || 1;
  let maxCells = 1;
  const list = [];
  for (const p of themes){ const cs = cellsOf(p.v); maxCells = Math.max(maxCells, cs.length); list.push({p, cs}); }
  b.style.gridTemplateColumns = "repeat(" + n + ",1fr)";
  b.style.gridTemplateRows = "auto repeat(" + maxCells + ",1fr)";
  b.style.gridAutoFlow = "column";
  // размер шрифта цен и тем
  const cfs = maxCells >= 7 ? 30 : maxCells >= 6 ? 36 : maxCells >= 5 ? 44 : 50;
  const tfs = n >= 6 ? 30 : n >= 5 ? 34 : 38;
  b.style.setProperty("--cfs", cfs + "px");
  b.style.setProperty("--tfs", tfs + "px");
  for (const {p,cs} of list){
    const h = document.createElement("div");
    h.className = "tTheme"; h.textContent = p.v.title || "ТЕМА";
    b.appendChild(h);
    let ci = 0;
    for (const cp of cs){
      const d = document.createElement("div");
      d.className = "cell" + (cp.v.used ? " used" : "");
      d.dataset.tk = p.key; d.dataset.ck = cp.key;
      if (!cp.v.used){
        const s = document.createElement("span");
        s.className = "price"; s.textContent = cp.v.price;
        d.appendChild(s);
      }
      b.appendChild(d); ci++;
    }
    for (; ci < maxCells; ci++){
      const bl = document.createElement("div"); bl.className = "cell blank"; b.appendChild(bl);
    }
  }
  reapplySelectClass();
}
function reapplySelectClass(){
  document.querySelectorAll(".cell.sel").forEach(e=>e.classList.remove("sel"));
  const cell = state.live && state.live.cell;
  if (cell && state.live.phase === "select"){
    const el = document.querySelector('.cell[data-tk="'+cell.t+'"][data-ck="'+cell.c+'"]');
    if (el) el.classList.add("sel");
  }
}

/* --- заставка / сплэш --- */
let lastRound = null, splashTimer = null;
function handleRoundChange(){
  const r = state.live.round;
  const changed = lastRound !== null && lastRound !== r;
  lastRound = r;
  $("roundBadge").textContent = "РАУНД " + (r+1);
  if (changed && state.meta.boardVisible){
    $("splashText").textContent = "РАУНД " + (r+1);
    const sp = $("splash");
    sp.classList.remove("on"); void sp.offsetWidth; sp.classList.add("on");
    clearTimeout(splashTimer);
    splashTimer = setTimeout(()=>sp.classList.remove("on"), 2100);
  }
}
function handleTitle(){
  const t = $("titleScreen");
  const show = !state.meta.boardVisible && !state.meta.winner;
  t.classList.toggle("on", show);
  if (show){
    const tp = $("tPlayers");
    const names = ["p1","p2","p3"].map(k=>state.players[k].name).filter(Boolean);
    if (names.length) tp.innerHTML = names.map(n=>"<span>"+esc(n)+"</span>").join("");
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* --- панель игроков --- */
let winnerForceShow = false;
function renderPlayers(){
  const row = $("playersRow");
  for (const k of ["p1","p2","p3"]){
    const p = state.players[k], box = $("pb-"+k);
    $("pn-"+k).textContent = p.name || "ИГРОК " + k[1];
    const sv = $("pv-"+k); sv.textContent = p.score;
    sv.className = "pscore " + (p.score > 0 ? "pos" : p.score < 0 ? "neg" : "zero");
    const name = $("pn-"+k);
    const ln = (p.name || "ИГРОК " + k[1]).length;
    box.classList.remove("narrow","tiny");
    if (ln > 10) box.classList.add("tiny"); else if (ln > 7) box.classList.add("narrow");
    box.classList.toggle("active", state.live.activePlayer === k && !state.meta.winner);
  }
  const show = state.meta.playersVisible || winnerForceShow;
  row.classList.toggle("off", !show);
}

/* --- общий render --- */
let curCard = null;
function render(){
  fitStage();
  renderBoard();
  renderPlayers();
  handleRoundChange();
  handleTitle();
  phaseMachine();
  winnerMachine();
  if (state.meta.winner) $("soundBtn").classList.remove("show");
}
/* ===================== фазы вопроса/ответа ===================== */
let phaseKey = "", shownCardKey = "";
let phaseTimers = [];
function pt(fn, ms){ phaseTimers.push(setTimeout(fn, ms)); }
function clearPhaseTimers(){ phaseTimers.forEach(clearTimeout); phaseTimers = []; }

function hideCards(instant){
  clearPhaseTimers();
  for (const el of [$("cardQ"), $("cardA")]){
    el.classList.remove("in","out");
    if (instant) el.classList.add("hidden");
    else if (!el.classList.contains("hidden")){ el.classList.add("out"); pt(()=>el.classList.add("hidden"), 960); }
  }
  if (instant){ $("modalWrap").classList.remove("on"); shownCardKey = ""; }
}
function invalidateTimersOf(el){ el.classList.remove("in","out"); }

function fillCard(card, data, label){
  const txt = card.querySelector(".cardText"), img = card.querySelector(".cardImg");
  const d = data || {};
  const hasText = !!(d.text && String(d.text).trim());
  const hasImg = !!(d.img);
  txt.textContent = hasText ? d.text : "…";
  if (hasImg){ img.src = d.img; img.style.display = "block"; img.onload = ()=>fitCard(card); } else { img.removeAttribute("src"); img.style.display = "none"; }
  card.querySelector(".cardTop").textContent = label;
  card.classList.toggle("onlyimg", !hasText && hasImg);
}
function fitCard(card){
  const txt = card.querySelector(".cardText");
  if (card.classList.contains("onlyimg")) return;
  const len = (txt.textContent || "").length;
  let fs = len <= 40 ? 110 : len <= 120 ? 74 : len <= 240 ? 54 : len <= 420 ? 40 : 30;
  if (card.querySelector(".cardImg").style.display === "block" && !card.classList.contains("onlyimg")) fs = Math.min(fs, 46);
  txt.style.fontSize = fs + "px";
  let guard = 40;
  while (guard-- > 0 && txt.scrollHeight > txt.clientHeight + 2 && fs > 18){
    fs -= 2; txt.style.fontSize = fs + "px";
  }
}
function showCard(card, key){
  const wrap = $("modalWrap");
  wrap.classList.add("on");
  card.classList.remove("hidden","out");
  void card.offsetWidth;
  card.classList.add("in");
  shownCardKey = key;
  curCard = card;
  requestAnimationFrame(()=>fitCard(card));
  setTimeout(()=>fitCard(card), 100); // после прогрузки картинки
}

function startSelectAnim(){
  reapplySelectClass();
}

/* --- кот --- */
let catKeyDone = "";
function keyOfCell(cell){ return cell ? cell.r + "/" + cell.t + "/" + cell.c + "@" + (state.live.ts||0) : ""; }
function showCatIntro(){
  $("catIntro").classList.remove("on"); void $("catIntro").offsetWidth;
  $("catIntro").classList.add("on");
}
function hideCatIntro(){ $("catIntro").classList.remove("on"); }

/* --- мелодия --- */
let audioEl = null, soundBlocked = false;
function playMusic(u){
  if (!u) return;
  try{
    if (!audioEl) audioEl = new Audio();
    if (audioEl.src !== u){ audioEl.src = u; }
    audioEl.loop = true; audioEl.currentTime = 0;
    audioEl.play().then(()=>{ soundBlocked = false; $("soundBtn").classList.remove("show"); })
      .catch(()=>{ soundBlocked = true; $("soundBtn").classList.add("show"); });
  }catch(e){ soundBlocked = true; $("soundBtn").classList.add("show"); }
}
function stopMusic(){ if (audioEl){ try{ audioEl.pause(); }catch(e){} } }
$("soundBtn").addEventListener("click", ()=>{
  soundBlocked = false; $("soundBtn").classList.remove("show");
  playMusic(state.meta.musicUrl);
  if (state.live.phase !== "question" || !cellByRef(state.live.cell||{})) stopMusic();
});

/* --- машина фаз --- */
function phaseMachine(){
  const live = state.live || {phase:"idle", cell:null};
  const cell = (live.cell && cellByRef(live.cell)) || null;
  const key = live.phase + "|" + keyOfCell(live.cell) + "|" + (cell && cell.cat ? "cat" : "");
  if (key === phaseKey){ return; }
  const prev = phaseKey; phaseKey = key;

  if (live.phase === "select"){
    hideCards(false); hideCatIntro(); stopMusic();
    startSelectAnim();
    return;
  }
  if (live.phase === "question"){
    if (shownCardKey === key) return; // карточка уже показана (дубль записи)
    reapplySelectClass();
    const data = cell ? (cell.q || {}) : {};
    if (cell && cell.cat && catKeyDone !== key){
      catKeyDone = key;
      fillCard($("cardQ"), data, "ВОПРОС");
      $("cardA").classList.add("hidden");
      showCatIntro();
      playMusic(state.meta.musicUrl);
      pt(()=>{ hideCatIntro(); $("modalWrap").classList.add("on"); showCard($("cardQ"), key); stopMusic(); }, 2600);
      pt(()=>fitCard(curCard), 2750);
    } else {
      hideCatIntro(); stopMusic();
      fillCard($("cardQ"), data, "ВОПРОС");
      $("cardA").classList.add("hidden");
      showCard($("cardQ"), key);
    }
    return;
  }
  if (live.phase === "answer"){
    hideCatIntro(); stopMusic();
    const data = cell ? (cell.a || {}) : {};
    if (shownCardKey && shownCardKey.indexOf(live.phase+"|") !== 0){
      // плавная смена: вопрос гаснет (0.95с), затем ответ появляется (1с)
      fillCard($("cardA"), data, "ОТВЕТ");
      const q = $("cardQ");
      if (!q.classList.contains("hidden")){
        q.classList.remove("in"); q.classList.add("out");
        pt(()=>{ q.classList.add("hidden"); q.classList.remove("out"); showCard($("cardA"), key); }, 950);
      } else showCard($("cardA"), key);
    } else {
      fillCard($("cardA"), data, "ОТВЕТ");
      $("cardQ").classList.add("hidden");
      showCard($("cardA"), key);
    }
    return;
  }
  /* idle */
  hideCards(false); hideCatIntro(); stopMusic();
}

/* ===================== победитель ===================== */
let winnerState = null, winnerTimers = [];
function clearWinnerTimers(){ winnerTimers.forEach(clearTimeout); winnerTimers = []; }
function winnerMachine(){
  const w = state.meta.winner || null;
  if (w === winnerState) return;
  clearWinnerTimers(); clearPhaseTimers();
  if (!w){
    winnerState = null; winnerForceShow = false;
    $("winnerScreen").classList.remove("on");
    $("playersRow").classList.remove("playersDim");
    for (const k of ["p1","p2","p3"]) $("pb-"+k).classList.remove("winblink","winbig");
    stopConfetti();
    return;
  }
  winnerState = w; winnerForceShow = true; renderPlayers();
  const box = $("pb-" + w);
  for (const k of ["p1","p2","p3"]) $("pb-"+k).classList.remove("winblink","winbig");
  hideCards(true); hideCatIntro(); stopMusic();
  box.classList.add("winblink");
  winnerTimers.push(setTimeout(()=>{ box.classList.remove("winblink"); box.classList.add("winbig"); $("playersRow").classList.add("playersDim"); }, 1250));
  winnerTimers.push(setTimeout(()=>{
    const p = state.players[w];
    $("wName").textContent = p.name || "ИГРОК " + w[1];
    $("wScore").textContent = "итог: " + p.score;
    $("winnerScreen").classList.add("on");
    startConfetti();
  }, 2050));
}
/* ===================== конфетти ===================== */
const confCanvas = $("confetti");
let confParts = [], confRunning = false, confStopT = 0;
function startConfetti(){
  confParts = [];
  for (let i=0;i<170;i++){
    confParts.push({
      x: Math.random()*1920, y: -Math.random()*700 - 20,
      w: 8+Math.random()*10, h: 12+Math.random()*10,
      vx: -1.4+Math.random()*2.8, vy: 2+Math.random()*3.4,
      rot: Math.random()*Math.PI, vr: -.12+Math.random()*.24,
      c: ["#ffd75e","#ff5c5c","#5ecbff","#7dff8a","#ffffff","#c78bff"][Math.floor(Math.random()*6)]
    });
  }
  confCanvas.style.display = "block";
  confStopT = Date.now() + 7500;
  if (!confRunning){ confRunning = true; confLoop(); }
}
function stopConfetti(){ confStopT = 0; }
function confLoop(){
  if (!confRunning) return;
  if (confStopT && Date.now() > confStopT && confParts.every(p=>p.y > 1120)){
    confRunning = false; confCanvas.style.display = "none";
    confCanvas.getContext("2d").clearRect(0,0,1920,1080);
    return;
  }
  const ctx = confCanvas.getContext("2d");
  ctx.clearRect(0,0,1920,1080);
  for (const p of confParts){
    p.x += p.vx; p.y += p.vy; p.vy += 0.02; p.rot += p.vr;
    if (p.y > 1120){ if (confStopT && Date.now() > confStopT) continue; p.y = -20; p.vy = 2+Math.random()*3.4; }
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
  }
  requestAnimationFrame(confLoop);
}

/* сценарий для теста: ?demo=1&show=q|qimg|a|cat|win|b|title */
function applyShowParam(){
  const show = qs.get("show"); if (!show) return;
  state.meta.boardVisible = (show !== "title");
  if (show === "b" || show === "title"){ scheduleRender(); return; }
  const pick = (r,t,cn)=>({r, t:String(t), c:String(cn), cat:!!state.plan.rounds[r].themes[t].cells[cn].cat});
  const set = (cellP, phase)=>{
    state.live.cell = cellP; state.live.ts = Date.now(); state.live.phase = phase;
  };
  setTimeout(()=>{
    if (show === "q")    set(pick(0,0,0), "question");
    if (show === "qimg") set(pick(0,0,4), "question");
    if (show === "a")  { set(pick(1,1,0), "question"); setTimeout(()=>{ state.live.phase = "answer"; scheduleRender(); }, 2500); }
    if (show === "cat")  set(pick(0,1,2), "question");
    if (show === "win"){ state.meta.winner = "p2"; state.players.p2.score = 2400; }
    scheduleRender();
  }, 1200);
}
