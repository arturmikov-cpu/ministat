<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Титр 2 · Смирнов Владимир Александрович</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#C8F135;
    --plate:rgba(13,16,21,.95);
    --text:#F3F5F7;
    --muted:#9AA2AC;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:transparent}
  body{font-family:'Oswald','Arial Narrow',sans-serif;-webkit-font-smoothing:antialiased}
  img{user-select:none;-webkit-user-drag:none}

  /* сцена 1920×1080, масштабируется под размер browser source */
  #stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;
    transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}

  .lower-third{
    --lt-scale:.5;                                  /* 0.5 = −50% */
    position:absolute;left:108px;bottom:108px;
    transform-origin:left bottom;
    opacity:0;visibility:hidden;
    transform:translateX(calc(-46px * var(--lt-scale))) scale(var(--lt-scale));
    transition:opacity .3s ease,transform .3s ease,visibility 0s linear .3s;
    filter:drop-shadow(0 22px 44px rgba(0,0,0,.55)) drop-shadow(0 4px 10px rgba(0,0,0,.35));
  }
  .lower-third.is-in{
    opacity:1;visibility:visible;transform:scale(var(--lt-scale));
    transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1),visibility 0s;
  }
  .lt-row{display:flex;align-items:flex-end}
  .lt-main{display:flex;align-items:stretch}
  .cut{clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}

  .lt-photo{width:150px;height:214px;background:#2A313B;padding:2px}
  .lt-photo img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;
    filter:saturate(.95) contrast(1.06);
    clip-path:inset(0 100% 0 0);transition:clip-path .32s ease}
  .is-in .lt-photo img{clip-path:inset(0 0 0 0);transition:clip-path .6s cubic-bezier(.22,1,.36,1) .1s}

  .lt-plate{position:relative;background:var(--plate);padding:24px 34px 26px 30px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    opacity:0;transform:translateX(-18px);
    transition:opacity .28s ease,transform .32s ease}
  .is-in .lt-plate{opacity:1;transform:none;
    transition:opacity .5s cubic-bezier(.22,1,.36,1) .16s,transform .5s cubic-bezier(.22,1,.36,1) .16s}

  .lt-top{display:flex;align-items:center;gap:14px}
  .lt-tick{width:14px;height:14px;background:var(--accent);transform-origin:left center;
    transform:skewX(-14deg) scaleX(0);transition:transform .25s ease}
  .is-in .lt-tick{transform:skewX(-14deg) scaleX(1);transition:transform .45s cubic-bezier(.22,1,.36,1) .24s}
  .lt-role{font:500 19px/1 'Oswald';letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .lt-sep{width:26px;height:1px;background:#2A313B}
  .lt-num{font:500 14px 'JetBrains Mono',monospace;letter-spacing:.1em;color:#5A636E}

  .mask{overflow:hidden;display:block}
  .mask-in{display:inline-block;transform:translateY(114%);transition:transform .3s ease}
  .is-in .lt-role .mask-in{transform:none;transition:transform .55s cubic-bezier(.22,1,.36,1) .3s}
  .is-in .lt-name .mask-in{transform:none;transition:transform .62s cubic-bezier(.22,1,.36,1) .38s}

  .lt-name{margin-top:10px;font:600 58px/1.12 'Oswald';letter-spacing:.015em;
    text-transform:uppercase;color:var(--text);white-space:nowrap}

  .lt-progress{position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--accent);
    transform-origin:left center;transform:scaleX(0)}
  .is-in .lt-progress{animation:ltProgress 9.4s linear .55s forwards}
  @keyframes ltProgress{from{transform:scaleX(1)}to{transform:scaleX(0)}}

  .lt-divider{width:10px;background:var(--accent);transform-origin:left center;
    transform:scaleX(0);transition:transform .25s ease}
  .is-in .lt-divider{transform:scaleX(1);transition:transform .45s cubic-bezier(.22,1,.36,1) .5s}

  .lt-chip{width:150px}
  .lt-chip-in{width:100%;height:100%;background:#EDEFF2;display:flex;align-items:center;justify-content:center;
    clip-path:inset(0 0 0 100%);transition:clip-path .3s ease}
  .is-in .lt-chip-in{clip-path:inset(0 0 0 0);transition:clip-path .5s cubic-bezier(.22,1,.36,1) .56s}
  .lt-chip img{max-width:70%;max-height:72%;object-fit:contain;display:block;
    opacity:0;transform:scale(1.12);transition:opacity .25s ease,transform .3s ease}
  .is-in .lt-chip img{opacity:1;transform:none;
    transition:opacity .45s ease .66s,transform .55s cubic-bezier(.22,1,.36,1) .66s}
</style>
</head>
<body>

<div id="stage">
  <article class="lower-third">
    <div class="lt-row">
      <div class="lt-photo cut"><img src="https://img.nagradion.ru/images/normal/m/person1081363037.jpg" alt=""></div>
      <div class="lt-main">
        <div class="lt-plate">
          <div class="lt-top">
            <span class="lt-tick"></span>
            <span class="lt-role mask"><span class="mask-in">Организатор спортивно-массовых мероприятий СШОР Звезда</span></span>
            <span class="lt-sep"></span>
            <span class="lt-num">02</span>
          </div>
          <div class="lt-name mask"><span class="mask-in">Чадов Максим Владимирович</span></div>
          <span class="lt-progress"></span>
        </div>
        <span class="lt-divider"></span>
        <div class="lt-chip cut"><div class="lt-chip-in"><img src="https://img.nagradion.ru/images/bf300x500/shields/J1YHUJmB.png" alt=""></div></div>
      </div>
    </div>
  </article>
</div>

<script>
/* ============ НАСТРОЙКИ ============ */
const SHOW_MS     = 10000; // время в эфире, мс
const START_DELAY = 600;   // пауза перед выходом после загрузки страницы

const el = document.querySelector('.lower-third');

/* ждём шрифты и картинки (но не дольше 2.5 с), затем показываем */
const urls = [...document.querySelectorAll('.lower-third img')].map(i=>i.src);
const ready = Promise.all([
  document.fonts.ready,
  ...urls.map(u=>new Promise(res=>{const im=new Image();im.onload=im.onerror=res;im.src=u;}))
]);
Promise.race([ready, new Promise(r=>setTimeout(r,2500))]).then(()=>{
  setTimeout(()=>{
    el.classList.add('is-in');
    setTimeout(()=>el.classList.remove('is-in'), SHOW_MS);
  }, START_DELAY);
});

/* масштаб 1920×1080 под фактический размер browser source */
const stage = document.getElementById('stage');
const fit = ()=>stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080));
addEventListener('resize', fit); fit();
</script>
</body>
</html>
